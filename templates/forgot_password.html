{% extends "base.html" %}

{% block title %}Reset Password — FindMate{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-sm-8">
      
      <div class="text-center mb-4">
        <div class="fm-logo-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="bi bi-key-fill"></i>
        </div>
        <h2 class="h3 fw-bold text-dark mb-1">Reset Password</h2>
        <p class="text-muted small">Enter your campus email to receive recovery instructions</p>
      </div>

      <div class="fm-form-card">
        <form action="{{ url_for('auth.forgot_password') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

          <div class="mb-4">
            <label class="form-label fw-bold small text-dark">Registered Campus Email *</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" class="form-control border-start-0 ps-0" placeholder="student@university.edu" required autofocus>
            </div>
          </div>

          <button type="submit" class="fm-btn-coral w-100 py-2 mb-3">
            Send Reset Instructions
          </button>

          <div class="text-center text-muted small">
            Remembered your password? 
            <a href="{{ url_for('auth.login') }}" class="fw-bold text-teal text-decoration-none">Return to Sign In</a>
          </div>
        </form>
      </div>

    </div>
  </div>
</div>
{% endblock %}
