{% extends "base.html" %}

{% block title %}500 — Server Error — FindMate{% endblock %}

{% block content %}
<div class="container py-5 text-center my-5">
  <div class="fm-logo-icon mx-auto mb-3" style="width: 54px; height: 54px; font-size: 1.8rem; background: var(--fm-crimson);">
    <i class="bi bi-exclamation-triangle-fill"></i>
  </div>
  <h1 class="display-4 fw-bold text-dark mb-2">500 — Server Error</h1>
  <p class="text-muted fs-6 mb-4 max-w-500 mx-auto" style="max-width: 500px;">
    An internal server error occurred while processing your request. Please try again shortly or contact campus IT support.
  </p>
  <div class="d-flex justify-content-center gap-3">
    <a href="{{ url_for('item.home') }}" class="fm-btn-pill-coral">
      <i class="bi bi-house-door me-1"></i> Return Home
    </a>
    <a href="{{ url_for('item.faq') }}#support" class="fm-btn-outline">
      <i class="bi bi-headset me-1"></i> Contact Support
    </a>
  </div>
</div>
{% endblock %}
