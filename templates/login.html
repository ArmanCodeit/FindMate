{% extends "base.html" %}

{% block title %}Sign In — FindMate Campus Portal{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-5 col-sm-8">
      
      <div class="text-center mb-4">
        <div class="fm-logo-icon mx-auto mb-2" style="width: 48px; height: 48px; font-size: 1.5rem;">
          <i class="bi bi-geo-alt-fill"></i>
        </div>
        <h2 class="h3 fw-bold text-dark mb-1">Sign in to FindMate</h2>
        <p class="text-muted small">Campus Lost &amp; Found Central Registry</p>
      </div>

      <div class="fm-form-card">
        <form action="{{ url_for('auth.login') }}" method="POST">
          <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
          {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
          {% endif %}

          <div class="mb-3">
            <label class="form-label fw-bold small text-dark">Campus Email Address *</label>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-envelope"></i></span>
              <input type="email" name="email" id="login-email" class="form-control border-start-0 ps-0" placeholder="student@university.edu" required autofocus>
            </div>
          </div>

          <div class="mb-3">
            <div class="d-flex justify-content-between align-items-center mb-1">
              <label class="form-label fw-bold small text-dark mb-0">Password *</label>
              <a href="{{ url_for('auth.forgot_password') }}" class="small text-danger text-decoration-none fw-semibold">Forgot password?</a>
            </div>
            <div class="input-group">
              <span class="input-group-text bg-light text-muted border-end-0"><i class="bi bi-lock"></i></span>
              <input type="password" name="password" id="login-password" class="form-control border-start-0 ps-0" placeholder="••••••••" required>
            </div>
          </div>

          <div class="form-check mb-4">
            <input class="form-check-input" type="checkbox" name="remember" id="rememberMe">
            <label class="form-check-label text-muted small" for="rememberMe">
              Remember me on this browser
            </label>
          </div>

          <button type="submit" class="fm-btn-coral w-100 py-2 mb-3">
            Sign In
          </button>

          <div class="text-center text-muted small">
            Don't have an account yet? 
            <a href="{{ url_for('auth.register') }}" class="fw-bold text-teal text-decoration-none">Create Student Account</a>
          </div>
        </form>

      </div>

    </div>
  </div>
</div>
{% endblock %}
